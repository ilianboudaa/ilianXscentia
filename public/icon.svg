<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Bordeaux Luxe Gradient -->
    <linearGradient id="scentiaBordeaux" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#7a2030" />
      <stop offset="35%" stop-color="#5e1926" />
      <stop offset="85%" stop-color="#420f1a" />
      <stop offset="100%" stop-color="#2a050d" />
    </linearGradient>

    <!-- Champagne / Radiant Gold Gradient -->
    <linearGradient id="scentiaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a68023" />
      <stop offset="25%" stop-color="#dfc067" />
      <stop offset="50%" stop-color="#fff2c9" />
      <stop offset="75%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8f6b17" />
    </linearGradient>

    <!-- Warm Silk Gold -->
    <linearGradient id="scentiaGoldSoft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faecc5" />
      <stop offset="55%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9e771d" />
    </linearGradient>
  </defs>

  <!-- Warm Ivory Seal Background Disc for contrast across light/dark browser tabs -->
  <circle cx="60" cy="60" r="58" fill="#fdfbf7" />

  <!-- LUXURY EMBLEMATIC CIRCULAR FRAME -->
  <circle cx="60" cy="60" r="56" stroke="url(#scentiaGold)" stroke-width="1.3" stroke-opacity="0.9" />
  <circle cx="60" cy="60" r="52.5" stroke="url(#scentiaGold)" stroke-width="0.6" stroke-dasharray="1.5 2.5" stroke-opacity="0.65" />

  <!-- Cardinal micro-diamonds -->
  <path d="M 60 2.2 L 61.4 4 L 60 5.8 L 58.6 4 Z" fill="url(#scentiaGold)" />
  <path d="M 60 114.2 L 61.4 116 L 60 117.8 L 58.6 116 Z" fill="url(#scentiaGold)" />
  <path d="M 2.2 60 L 4 61.4 L 5.8 60 L 4 58.6 Z" fill="url(#scentiaGold)" />
  <path d="M 114.2 60 L 116 61.4 L 117.8 60 L 116 58.6 Z" fill="url(#scentiaGold)" />

  <!-- BOTANICAL BACKGROUND BRANCHES (Behind S) -->
  <path d="M 44 24 C 41 16, 46 9, 54 8 C 62 7, 70 10, 76 15"
        fill="none" stroke="url(#scentiaGold)" stroke-width="1.1" stroke-linecap="round" />
  <path d="M 48 11 C 42 9, 38 4, 45 3 C 50 4, 50 9, 48 11 Z" fill="url(#scentiaGold)" />
  <path d="M 58 8 C 61 3, 68 2, 71 6 C 66 8, 60 7, 58 8 Z" fill="url(#scentiaGoldSoft)" />
  <path d="M 76 15 C 82 12, 88 15, 91 11 C 86 9, 80 12, 76 15 Z" fill="url(#scentiaGold)" />

